<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم مهارة التواصل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--fg:#14213d;--mut:#5f6b7f;--bd:#e1e6f0;--pri:#3454d1;--pri2:#5b7cff;--soft:#eaeefd;--good:#0f9d77;--goodsoft:#e2f6ef;--warn:#d9822b;--warnsoft:#fdf0e1;--bad:#c0392b;--shadow:0 10px 30px rgba(30,50,110,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--fg:#e9edf7;--mut:#a1abc2;--bd:#2a3553;--pri:#7e9bff;--pri2:#a3b7ff;--soft:#222c4d;--good:#3ccf9f;--goodsoft:#13302a;--warn:#f0a152;--warnsoft:#35281a;--bad:#ff8f80;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
.top{height:6px;background:var(--soft)}
.top>div{height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .4s ease}
main{max-width:660px;margin:0 auto;padding:28px 16px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--pri);margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px 22px;box-shadow:var(--shadow);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.4;margin:0 0 8px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:22px 0 8px}
h1:focus,h2:focus{outline:none}
.mut{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.chip{background:var(--soft);color:var(--pri);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:500}
.chip.good{background:var(--goodsoft);color:var(--good)}
label.f{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:var(--bg);color:var(--fg)}
input[type=text]:focus{outline:3px solid var(--soft);border-color:var(--pri)}
.hint{font-size:14px;color:var(--mut);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 26px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.qnum{font-size:14px;color:var(--mut);font-weight:500}
.qtext{font-size:23px;line-height:1.7;font-weight:600;margin:6px 0 20px}
.opts{display:grid;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);transition:.15s}
.opt b{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.opt:hover span{border-color:var(--pri)}
.opt input:checked+span{border-color:var(--pri);background:var(--soft);font-weight:600}
.opt input:checked+span b{background:var(--pri);color:#fff}
.opt input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.kb{font-size:13px;color:var(--mut);margin-top:12px}
.load{text-align:center;padding:50px 10px}
.spin{width:46px;height:46px;border:4px solid var(--soft);border-top-color:var(--pri);border-radius:50%;margin:0 auto 18px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--warnsoft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:500}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{position:relative;width:132px;height:132px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.gauge .n b{font-size:30px}.gauge .n small{color:var(--mut)}
.comp{margin:12px 0}
.comp .h{display:flex;justify-content:space-between;font-weight:500;font-size:15px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .8s ease}
.gap{border:1px solid var(--bd);border-right:5px solid var(--warn);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.gap h4{margin:0 0 4px;font-size:16px}
.gap .rec{margin-top:8px;background:var(--goodsoft);border-radius:10px;padding:8px 12px;font-size:15px}
.note{font-size:13px;color:var(--mut);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.brand,.row,.noprint{display:none!important}.card{box-shadow:none;border:0}body{background:#fff}}
</style>
</head>
<body>
<div class="top" aria-hidden="true"><div id="prog"></div></div>
<main>
  <div class="brand"><div class="logo" aria-hidden="true">✦</div><span>تقييم مهارات التواصل</span></div>
  <div id="view" aria-live="polite"></div>
</main>

<script>
const SCALE=["أبداً","نادراً","أحياناً","غالباً","دائماً"];
const LEVELS={beginner:"مبتدئ",developing:"قيد التطور",proficient:"متمكن",advanced:"متقدم"};
const AR={active_listening:"الاستماع الفعّال",clarity:"وضوح التعبير",feedback:"تقديم وتقبّل الملاحظات",conflict_handling:"إدارة الخلافات",written_communication:"التواصل الكتابي"};
const GAP_T=4.0;
const $=id=>document.getElementById(id);
let questions=[],answers={},name="";

function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function show(node){const v=$("view");v.textContent="";v.appendChild(node);const h=node.querySelector("h1,h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:"smooth"})}
function progress(p){$("prog").style.width=(p*100)+"%"}
function card(){return el("section",undefined,"card")}

async function init(){
  try{const r=await fetch("/api/questions");if(!r.ok)throw 0;questions=await r.json();intro()}
  catch(e){const c=card();c.appendChild(el("h2","تعذّر تحميل التقييم"));c.appendChild(el("p","تأكد من اتصالك ثم حدّث الصفحة.","mut"));show(c)}
}

function intro(){
  progress(0);answers={};
  const c=card();
  c.appendChild(el("h1","اكتشف مستواك في مهارات التواصل"));
  c.appendChild(el("p","أجب عن "+questions.length+" عبارات بصدق، ثم احصل على تقرير شخصي يوضح نقاط قوتك وأين تحتاج للتطوير.","mut"));
  const chips=el("div",undefined,"chips");
  ["⏱ دقيقتان تقريباً","📝 "+questions.length+" أسئلة","📊 تقرير فوري"].forEach(t=>chips.appendChild(el("span",t,"chip")));
  c.appendChild(chips);
  c.appendChild(el("label","الاسم","f")).setAttribute("for","name");
  const inp=el("input");inp.type="text";inp.id="name";inp.maxLength=80;inp.autocomplete="name";inp.value=name;inp.placeholder="اكتب اسمك";
  c.appendChild(inp);
  const err=el("div","اكتب اسمك للمتابعة.","err");err.hidden=true;c.appendChild(err);
  c.appendChild(el("p","لا توجد إجابات صحيحة أو خاطئة. تُحفظ إجاباتك لأغراض هذا التقييم.","hint"));
  const row=el("div",undefined,"row");
  const b=el("button","ابدأ التقييم","btn");
  const go=()=>{name=inp.value.trim();if(!name){err.hidden=false;inp.focus();return}question(0)};
  b.onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  row.appendChild(b);c.appendChild(row);show(c);
}

function question(i){
  const q=questions[i],last=i===questions.length-1;
  progress(i/questions.length);
  const c=card();
  c.appendChild(el("div","سؤال "+(i+1)+" من "+questions.length,"qnum"));
  c.appendChild(el("h2",q.text,"qtext"));
  const g=el("div",undefined,"opts");g.setAttribute("role","radiogroup");g.setAttribute("aria-label",q.text);
  const next=el("button",last?"إنهاء وعرض التقرير":"التالي","btn");next.disabled=!answers[q.id];
  const go=()=>last?submit():question(i+1);
  SCALE.forEach((label,k)=>{
    const l=el("label",undefined,"opt"),r=el("input");
    r.type="radio";r.name="q";r.value=k+1;r.checked=answers[q.id]===k+1;
    const s=el("span");s.appendChild(el("b",String(k+1)));s.appendChild(document.createTextNode(label));
    r.onchange=()=>{answers[q.id]=k+1;next.disabled=false;if(!last)setTimeout(go,260)};
    l.appendChild(r);l.appendChild(s);g.appendChild(l);
  });
  c.appendChild(g);
  c.appendChild(el("p","تلميح: اضغط 1 إلى 5 من لوحة المفاتيح للاختيار السريع.","kb noprint"));
  const row=el("div",undefined,"row");
  const back=el("button","رجوع","btn ghost");back.onclick=()=>i===0?intro():question(i-1);
  next.onclick=go;
  row.appendChild(back);row.appendChild(next);c.appendChild(row);
  show(c);
  document.onkeydown=e=>{const n=Number(e.key);if(n>=1&&n<=5&&!e.target.matches("input[type=text]")){const r=g.querySelectorAll("input")[n-1];r.checked=true;r.dispatchEvent(new Event("change"))}};
}

async function submit(){
  document.onkeydown=null;progress(1);
  const c=card();c.className="card load";
  c.appendChild(el("div",undefined,"spin"));
  c.appendChild(el("h2","نحلّل إجاباتك..."));
  const m=el("p","نحسب درجاتك ونكتب توصياتك الشخصية","mut");c.appendChild(m);show(c);
  const msgs=["نحسب درجاتك","نحدد نقاط القوة","نكتب توصياتك الشخصية"];let k=0;
  const t=setInterval(()=>{k=(k+1)%msgs.length;m.textContent=msgs[k]},2200);
  try{
    const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user_name:name,answers:questions.map(q=>({question_id:q.id,value:answers[q.id]}))})});
    if(r.status===429)throw new Error("طلبات كثيرة. انتظر دقيقة ثم حاول مجدداً.");
    if(!r.ok)throw new Error("حدث خطأ أثناء المعالجة.");
    clearInterval(t);result(await r.json());
  }catch(e){
    clearInterval(t);
    const f=card();f.appendChild(el("h2","لم يكتمل التقرير"));
    f.appendChild(el("div",e instanceof TypeError?"تعذّر الاتصال بالخادم.":e.message,"err"));
    f.appendChild(el("p","إجاباتك ما زالت محفوظة هنا، يمكنك المحاولة مجدداً.","mut"));
    const row=el("div",undefined,"row"),b=el("button","إعادة المحاولة","btn");b.onclick=submit;row.appendChild(b);f.appendChild(row);show(f);
  }
}

function result(d){
  const r=d.report,s=d.scores,c=card();
  c.appendChild(el("h2","تقرير "+name));
  const hero=el("div",undefined,"hero");
  const C=2*Math.PI*54,g=el("div",undefined,"gauge");
  g.innerHTML='<svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="54" fill="none" stroke="var(--soft)" stroke-width="12"/><circle id="arc" cx="66" cy="66" r="54" fill="none" stroke="var(--pri)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1s ease"/></svg>';
  const n=el("div",undefined,"n"),nb=el("div");nb.appendChild(el("b",String(r.overall_score)));nb.appendChild(el("small"," / 5"));n.appendChild(nb);g.appendChild(n);
  const side=el("div");side.style.flex="1 1 220px";
  side.appendChild(el("span","المستوى: "+(LEVELS[r.overall_level]||r.overall_level),"chip"));
  side.appendChild(el("p",r.summary));
  hero.appendChild(g);hero.appendChild(side);c.appendChild(hero);
  if(r.generated_by==="fallback")c.appendChild(el("p","تم إنشاء تقرير مبسّط لتعذّر التحليل المفصّل حالياً.","note"));

  c.appendChild(el("h3","درجاتك حسب الكفاءة"));
  const bars=[];
  Object.keys(s).sort((a,b)=>s[a]-s[b]).forEach(k=>{
    const w=el("div",undefined,"comp"),h=el("div",undefined,"h");
    h.appendChild(el("span",AR[k]||k));h.appendChild(el("span",s[k]+" / 5"));
    const bar=el("div",undefined,"bar"),i=el("i");i.style.background=s[k]>=GAP_T?"var(--good)":"var(--warn)";
    bar.appendChild(i);w.appendChild(h);w.appendChild(bar);c.appendChild(w);bars.push([i,s[k]]);
  });

  if(r.strengths.length){
    c.appendChild(el("h3","نقاط القوة"));
    const ch=el("div",undefined,"chips");r.strengths.forEach(x=>ch.appendChild(el("span","✓ "+x,"chip good")));c.appendChild(ch);
  }
  if(r.gaps.length){
    c.appendChild(el("h3","أين تطوّر نفسك"));
    r.gaps.forEach(x=>{
      const b=el("div",undefined,"gap");
      b.appendChild(el("h4",x.label+" ("+x.score+" / 5)"));
      b.appendChild(el("div",x.why));
      b.appendChild(el("div","💡 "+x.recommendation,"rec"));
      c.appendChild(b);
    });
  }
  const row=el("div",undefined,"row");
  const a=el("button","إعادة التقييم","btn ghost");a.onclick=()=>{name="";intro()};
  const p=el("button","طباعة / حفظ PDF","btn");p.onclick=()=>window.print();
  row.appendChild(a);row.appendChild(p);c.appendChild(row);
  show(c);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.getElementById("arc").style.strokeDashoffset=C*(1-r.overall_score/5);
    bars.forEach(([i,v])=>i.style.width=(v/5*100)+"%");
  }));
}
init();
</script>
</body>
</html>
